# ==================== CDN 配置 ====================
CDN:
  internal_provider: local     # 主题内部文件使用本地
  third_party_provider: local  # **关键：所有第三方库强制使用本地**
  version: false               # **关键：关闭版本号，使用插件提供的固定版本**
  option:
    css:
      katex: /js/katex/katex.min.css                  # KaTeX数学公式样式
      prismjs: /js/prismjs/prism.min.css              # Prism代码高亮样式
    js:
      jquery: /js/jquery/jquery.min.js                # jQuery
      typed: /js/typed/typed.min.js                   # 打字机效果
      katex: /js/katex/katex.min.js                   # KaTeX数学公式核心
      prismjs: /js/prismjs/prism.min.js               # Prism代码高亮核心
      # ... 其他您需要的库

#注入自定义内容
inject:
  head:
    # FontAwesome - 移除integrity，修正本地路径
    - |
      <link rel="stylesheet" href="/lib/fontawesome/css/all.min.css">
      <link rel="stylesheet" href="/css/catalog.css"> <!-- 注入自定义CSS -->
  bottom:
    # 注入自定义JS
    - |
      <script src="/js/catalog-toggle.js"></script> <!-- 注入自定义JS -->


# ==================== 功能配置 ====================
# 关闭主题数学公式，避免冲突
katex:
  enable: false
  per_page: false
mathjax:
  enable: false


# 社交分享
social_share:
  enable: false

# 代码高亮
highlight:
  enable: true
  line_number: true
  theme: macos
  copy_button: true

# 夜间模式
darkmode:
  enable: true
  button: true
  autoChangeMode: 1  # 1: 跟随系统， 2: 根据时间

# 阅读模式
readmode:
  enable: true


# ==================== 首页配置 ====================

index:
  post_url_target: _blank
  post_count: 10

# 首页副标题配置
subtitle:
  enable: true          # 可以开启副标题功能
  effect: true          # 可以开启打字机效果
  # 关键：typed_option 必须显式配置为空或简单值，覆盖主题内置的CDN链接
  typed_option:
    # 保留为空对象，或者只设置基础参数，不指定外部src
    # 例如：
    # strings: ['道祖曰：立自我，成本我，利众生，达无我']
    # typeSpeed: 60
    # loop: true
  source: false
  sub:
    - 人性道祖曰：立自我，成本我，利众生，达无我
    - 神性道祖曰：理解此道、抛弃此道、超越此道、遗忘此道
    - 魔性道祖曰：背诵此道、宣传此道、执行此道、信仰此道
    - 道祖曰：神魔无相，刃盾活用




# ==================== 全局配置 ====================

#作者头像
avatar:
  img: /img/DaoZu.png
  effect: false

wordcount:
  enable: true
  # Display the word count of the article in post meta
  post_wordcount: true
  # Display the time to read the article in post meta
  min2read: true
  # Display the total word count of the website in aside's webinfo
  total_wordcount: true

# -------------------- 主题外观与字体 --------------------
theme_color:
  enable: true
  main: '#667eea'          # 主色调
  paginator: '#a78bfa'     # 分页器颜色
  button_hover: '#764ba2'  # 按钮悬停色
  text_selection: '#667eea' # 文本选中色
  link_color: '#4f46e5'    # 链接颜色
  link_hover_color: '#7c3aed' # 链接悬停色

font:
  font-family: "-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif"
  font-size: 16px
  code-font-size: 14px



# -------------------- 页面布局与导航 --------------------
menu:
  主页: / || fas fa-home
  
  # 核心：版本体系（阶段性成果）
  意识之道||fas fa-layer-group||hide:
    v1.0 - 立道祖: /versions/v1.0/ || fas fa-seedling
    v2.0 - 正在重构: /versions/v2.0/ || fas fa-code-branch
    思想地图: /mindmap/ || fas fa-project-diagram
    演进方向: /evolution/ || fas fa-network-wired
    版本历史: /versions/history/ || fas fa-history
  
  # 核心：道经体系（文章聚合门户）
  道经体系||fas fa-book-open||hide:
    道祖引道: /categories/dao-scripture/index/ || fas fa-hand-point-right
    法则篇: /categories/dao-scripture/principles/index/ || fas fa-gavel
    道演篇: /categories/dao-scripture/evolution/index/ || fas fa-code-branch
  
  # 核心：道境体系（文章聚合门户）
  道境体系||fas fa-mountain||hide:
    道祖引道: /categories/dao-state/index/ || fas fa-hand-point-right
    道境之门: /categories/dao-state/gate/index/ || fas fa-door-open
    境界论述: /categories/dao-state/state-discussion/index/ || fas fa-comment-alt
    实修根本: /categories/dao-state/foundation/index/ || fas fa-seedling
    实修经: /categories/dao-state/scripture/index/ || fas fa-book
    实修理术: /categories/dao-state/methods/index/ || fas fa-tools
  
  # 实践记录（持续性文章）
  道行实践||fas fa-list||hide:
    #实践方向||fas fa-compass||hide: 
    道祖引道: /categories/practice/index/ || fas fa-hand-point-right
    哲学之道: /categories/practice/philosophy/index/ || fas fa-brain
    科学之道: /categories/practice/science/index/ || fas fa-flask
    技术之道: /categories/practice/technology/index/ || fas fa-code
    道祖之道: /categories/practice/daozu/index/ || fas fa-pen-nib
    道论研习: /categories/discussion/index/ || fas fa-comments
    参考资源: /categories/reference/index/ || fas fa-bookmark
  
  # 辅助功能
  全部文章: /archives/ || fas fa-archive
  标签云图: /tags/ || fas fa-tags
  关于本站: /about/ || fas fa-info-circle




# -------------------- 侧边栏配置 --------------------
aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right

  # 作者卡片
  card_author:
    enable: true
    description: 《意识之道》创始人 | 思想探索者
    button:
      enable: true
      icon: fab fa-github
      text: GitHub
      link: https://github.com/yourusername


  # 公告栏
  card_announcement:
    enable: true
    content: '🧪 网站持续建设中'

  # 最新文章
  card_recent_post:
    enable: true
    limit: 5
    sort: updated # 可选 date

  # 分类与标签
  card_categories:
    enable: true
    limit: 10
  card_tags:
    enable: true
    limit: 20
    color: true

